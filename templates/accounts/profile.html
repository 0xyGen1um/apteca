{% extends 'base.html' %}{% block content %}<h1>Личный кабинет</h1><div class="row g-4"><div class="col-md-5"><div class="card p-4"><h4>Профиль</h4><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-success">Сохранить</button></form></div></div><div class="col-md-7"><h4>Мои заказы</h4>{% for order in orders %}<div class="card p-3 mb-2"><a href="{% url 'orders:detail' order.pk %}">Заказ №{{ order.pk }}</a><span>{{ order.get_status_display }} · {{ order.total_amount }} ₽</span></div>{% empty %}<p>Заказов пока нет.</p>{% endfor %}</div></div>{% endblock %}
