{% extends 'base.html' %}{% block content %}<h1>Управление заказами</h1>{% for order in orders %}<div class="card p-3 mb-2"><div><a href="{% url 'orders:detail' order.pk %}">№{{ order.pk }}</a> · {{ order.user.email }} · {{ order.get_status_display }}</div><form method="post" class="d-flex gap-2 mt-2">{% csrf_token %}<input type="hidden" name="order_id" value="{{ order.pk }}"><select name="status" class="form-select w-auto">{% for value,label in statuses %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select><button class="btn btn-success">Изменить</button></form></div>{% endfor %}{% endblock %}
