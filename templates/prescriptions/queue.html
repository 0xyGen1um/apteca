{% extends 'base.html' %}{% block content %}<h1>Проверка рецептов</h1>{% for item in items %}<div class="card p-3 mb-3"><h5>Заказ №{{ item.order.pk }} · {{ item.product.name }}</h5><a target="_blank" href="{{ item.image.url }}">Посмотреть рецепт</a><form method="post" class="mt-3">{% csrf_token %}<input type="hidden" name="id" value="{{ item.pk }}"><button class="btn btn-success" name="action" value="approve">Одобрить</button><input class="form-control d-inline w-auto" name="reason" placeholder="Причина отказа"><button class="btn btn-outline-danger" name="action" value="reject">Отклонить</button></form></div>{% empty %}<p>Нет рецептов на проверке.</p>{% endfor %}{% endblock %}
