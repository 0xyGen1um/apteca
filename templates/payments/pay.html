{% extends 'base.html' %}{% block content %}<div class="form-panel mx-auto"><h1>Оплата заказа №{{ order.pk }}</h1><p>Сумма: {{ order.total_amount }} ₽</p><p>Это демонстрация оплаты. Реальные деньги не списываются.</p><form method="post">{% csrf_token %}{% if order.payment_method == 'CARD' %}<label>Последние 4 цифры карты<input class="form-control" name="last4" maxlength="4" pattern="[0-9]{4}"></label><label class="mt-2">Платёжная система<input class="form-control" name="card_brand" maxlength="30"></label>{% endif %}<label class="d-block mt-3">Результат<select class="form-select" name="outcome"><option value="success">Успех</option><option value="decline">Отказ</option><option value="timeout">Тайм-аут</option></select></label><button class="btn btn-success mt-3">Выполнить</button></form></div>{% endblock %}
